<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Tareas</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <style>
      :root {
        --bg-main: #0f1115; /* fondo principal */
        --bg-surface: #161a22; /* cards / navbar */
        --border-subtle: #252a36; /* bordes */
        --text-main: #e5e7eb; /* texto principal */
        --text-muted: #9ca3af; /* texto secundario */
        --accent: #22c55e; /* verde sutil (podemos cambiar) */
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      a {
        text-decoration: none;
      }

      .navbar {
        background-color: var(--bg-surface);
        border-bottom: 1px solid var(--border-subtle);
      }

      .nav-link {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .nav-link:hover {
        color: var(--text-main);
      }

      .nav-link.active {
        color: var(--accent);
        font-weight: 500;
      }

      .card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
      }

      .badge {
        font-weight: 500;
        letter-spacing: 0.05em;
      }

      .text-muted {
        color: var(--text-muted) !important;
      }

      /* Auth cards */
      .auth-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 0.75rem;
      }

      /* Inputs dark */
      .form-control {
        background-color: #0f1115;
        border: 1px solid var(--border-subtle);
        color: var(--text-main);
      }

      .form-control:focus {
        background-color: #0f1115;
        color: var(--text-main);
        border-color: var(--accent);
        box-shadow: none;
      }

      .form-floating label {
        color: var(--text-muted);
      }

      /* Alerts */
      .alert {
        background-color: #0f1115;
        border: 1px solid var(--border-subtle);
        color: var(--text-main);
      }

      .form-label {
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      textarea.form-control {
        min-height: 120px;
        resize: vertical;
      }

      .form-check-input {
        background-color: #0f1115;
        border-color: var(--border-subtle);
      }

      .form-check-input:checked {
        background-color: var(--accent);
        border-color: var(--accent);
      }

      .task-card {
        display: block;
        padding: 1rem;
        border-radius: 0.75rem;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        color: var(--text-main);
        margin-bottom: 0.75rem;
        transition: all 0.15s ease;
      }

      .task-card:hover {
        border-color: #374151;
        transform: translateY(-2px);
      }

      .task-desc {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
      }

      .task-meta {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div>
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand fw-semibold text-light" href="/">
            Gestor<span class="text-success">Tareas</span>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-2">
              <li class="nav-item">
                <a href="/" class="nav-link active">Home</a>
              </li>

              {% if user.is_authenticated %}
              <li class="nav-item">
                <a href="{% url 'tasks' %}" class="nav-link">Pending</a>
              </li>
              <li class="nav-item">
                <a href="{% url 'tasks_completed' %}" class="nav-link"
                  >Completed</a
                >
              </li>
              <li class="nav-item">
                <a
                  href="{% url 'create_task' %}"
                  class="btn btn-success btn-sm"
                >
                  + New Tarea
                </a>
              </li>
              <li class="nav-item">
                <a href="{% url 'logout' %}" class="nav-link text-danger"
                  >Cerrar Sesión</a
                >
              </li>
              {% else %}
              <li class="nav-item">
                <a href="{% url 'signin' %}" class="nav-link">Iniciar Sesión</a>
              </li>
              <li class="nav-item">
                <a
                  href="{% url 'signup' %}"
                  class="btn btn-outline-success btn-sm"
                >
                  Registrarse
                </a>
              </li>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>

      {% block content %} {% endblock %}
    </div>
  </body>
</html>
