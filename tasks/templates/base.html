<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Tareas</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />

  </head>
  <body>
    <div>
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand fw-semibold text-light" href="/">
            Gestor<span class="text-success">Tareas</span>
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto gap-2">
              <li class="nav-item">
                <a href="/" class="nav-link active">Home</a>
              </li>

              {% if user.is_authenticated %}
              <li class="nav-item">
                <a href="{% url 'tasks' %}" class="nav-link">Pending</a>
              </li>
              <li class="nav-item">
                <a href="{% url 'tasks_completed' %}" class="nav-link"
                  >Completed</a
                >
              </li>
              <li class="nav-item">
                <a
                  href="{% url 'create_task' %}"
                  class="btn btn-success btn-sm"
                >
                  + New Tarea
                </a>
              </li>
              <li class="nav-item">
                <a href="{% url 'logout' %}" class="nav-link text-danger"
                  >Cerrar Sesión</a
                >
              </li>
              {% else %}
              <li class="nav-item">
                <a href="{% url 'signin' %}" class="nav-link">Iniciar Sesión</a>
              </li>
              <li class="nav-item">
                <a
                  href="{% url 'signup' %}"
                  class="btn btn-outline-success btn-sm"
                >
                  Registrarse
                </a>
              </li>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>

      {% block content %} {% endblock %}
    </div>
  </body>
</html>
