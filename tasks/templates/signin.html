{% extends 'base.html' %} {% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <form method="POST" class="auth-card p-4">
        <h2 class="text-center mb-1">Bievenido de nuevo</h2>
        <p class="text-center text-muted mb-4">
          Inicia sesión para continuar gestionando tus tareas
        </p>

        {% if error %}
        <div class="alert alert-danger mb-3">{{ error }}</div>
        {% endif %} {% csrf_token %}

        <div class="form-floating mb-3">
          <input
            type="text"
            class="form-control"
            name="username"
            id="username"
            placeholder="Username"
            required
          />
          <label for="username">Username</label>
        </div>

        <div class="form-floating mb-4">
          <input
            type="password"
            class="form-control"
            name="password"
            id="password"
            placeholder="Password"
            required
          />
          <label for="password">Password</label>
        </div>

        <button class="btn btn-success w-100 mb-3">Iniciar Sesión</button>

        <p class="text-center text-muted mb-0">
          ¿No tienes una cuenta?
          <a href="/signup/" class="text-success">Crea una</a>
        </p>
      </form>
    </div>
  </div>
</div>

{% endblock %}
