{% extends 'base.html' %} {% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="auth-card p-4">
        <h2 class="mb-1">Actualizar tarea</h2>
        <p class="text-muted mb-4">Edita los detalles de la tarea o actualiza su estado</p>

        <!-- Update form -->
        <form method="POST">
          {% csrf_token %}

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Titulo</label>
            {{ form.title }}
            <small class="text-muted"> Máximo 32 caracteres </small>
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Descripción</label>
            {{ form.description }}
          </div>

          <!-- Important -->
          <div class="form-check form-switch mb-4">
            {{ form.important }}
            <label class="form-check-label ms-2"> Marcar como importante </label>
          </div>

          <div class="d-flex justify-content-end">
            <button class="btn btn-success">Actualizar tarea</button>
          </div>
        </form>

        <hr class="my-4 border-secondary" />

        <!-- Secondary actions -->
        <div class="d-flex justify-content-between align-items-center">
          <!-- Complete -->
          <form action="{% url 'task_complete' task.id %}" method="POST">
            {% csrf_token %}
            <button class="btn btn-outline-success btn-sm">
              Completar
            </button>
          </form>

          <!-- Delete -->
          <form action="{% url 'task_delete' task.id %}" method="POST">
            {% csrf_token %}
            <button class="btn btn-outline-danger btn-sm">Eliminar tarea</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
