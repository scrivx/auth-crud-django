{% extends 'base.html' %} {% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="auth-card p-4">
        <h2 class="mb-1">Create task</h2>
        <p class="text-muted mb-4">
          Add a new task and keep your workflow organized
        </p>

        <form method="POST">
          {% csrf_token %}

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Title</label>
            {{ form.title }}
            <small class="text-muted"> Maximum 32 characters </small>
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description</label>
            {{ form.description }}
          </div>

          <!-- Important -->
          <div class="form-check form-switch mb-4">
            {{ form.important }}
            <label class="form-check-label ms-2"> Mark as important </label>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'tasks' %}" class="btn btn-outline-secondary">
              Cancel
            </a>
            <button class="btn btn-success">Save task</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
